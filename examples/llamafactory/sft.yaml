# llamafactory-cli train examples/llamafactory/sft.yaml
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
dataset: my_sft                 # registered with `convmerge llamafactory-info`
eval_dataset: my_sft_val
dataset_dir: data
template: qwen
cutoff_len: 2048
output_dir: out/sft
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2
logging_steps: 10
eval_strategy: steps
eval_steps: 200
save_steps: 500
