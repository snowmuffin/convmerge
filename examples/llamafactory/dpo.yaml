# llamafactory-cli train examples/llamafactory/dpo.yaml
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
stage: dpo
do_train: true
finetuning_type: lora
lora_target: all
pref_beta: 0.1
dataset: my_dpo                 # --format sharegpt-preference + llamafactory-info
dataset_dir: data
template: qwen
cutoff_len: 2048
output_dir: out/dpo
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 1
logging_steps: 10
