# Publish to PyPI when a version tag is pushed (e.g. v0.1.0).
# Uses a PyPI API token stored as the GitHub Actions secret ``PYPI_API_TOKEN``.
# To rotate: regenerate the token on pypi.org and replace the secret value.

name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag pushed on the wrong commit would otherwise rebuild and publish
      # whatever version that commit carries.
      - name: Check the tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          init=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/convmerge/__init__.py)
          if [ "$GITHUB_REF_NAME" != "v$version" ] || [ "$init" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version (__init__.py: $init); tag the merged release commit"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $version"

      - name: Install build tools
        run: python -m pip install -U pip hatch

      - name: Build
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
