# Publish only the distribution that passed CI on the exact release SHA.
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag, package and runtime versions agree
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          init=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/convmerge/__init__.py)
          if [ "$GITHUB_REF_NAME" != "v$version" ] || [ "$init" != "$version" ]; then
            echo "::error::release tag and package versions differ"
            exit 1
          fi
      - name: Download the already-tested main-branch artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq '[.workflow_runs[] | select(.head_branch == "main")][0].id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::no successful main CI for $GITHUB_SHA; publish after CI completes"
            exit 1
          fi
          verified_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)
          test "$verified_sha" = "$GITHUB_SHA"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "dist-$GITHUB_SHA" --dir dist
          sha256sum dist/*
      - name: Recheck the artifact before uploading
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          .wheel-smoke/bin/python -I scripts/verify_wheel.py
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
