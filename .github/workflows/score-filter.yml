name: Score-filter study

# Does training on the best-scored rows beat random rows at the same token count?
# Design, reading rule and gate decision: docs/design/score-filter-study.md. Run by hand.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Training steps per run (the token budget is steps x 8 x 512)
        default: "400"
      scale:
        description: Fraction of the pool to fetch (1.0 for the study)
        default: "1.0"
      seeds:
        description: JSON list of training seeds
        default: "[0, 1, 2, 3, 4]"
      gen:
        description: Evaluation prompts to generate for
        default: "100"

permissions:
  contents: read

concurrency:
  group: score-filter-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"
  PIP_ONLY_BINARY: "numpy,pandas,pyarrow"
  MODEL: HuggingFaceTB/SmolLM2-135M
  TOKENIZER: HuggingFaceTB/SmolLM2-135M-Instruct

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[fetch-all,tokens]"
      - name: Build the pool and both arms
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          STEPS: ${{ inputs.steps || '400' }}
        run: >-
          python scripts/eval/score_filter/prepare.py --out data --tokenizer "$TOKENIZER"
          --budget "$((STEPS * 8 * 512))" --scale "${{ inputs.scale || '1.0' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: score-filter-data
          path: |
            data/s.jsonl
            data/r.jsonl
            data/eval.jsonl
            data/stats.json

  train:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        arm: [s, r]
        seed: ${{ fromJSON(inputs.seeds || '[0, 1, 2, 3, 4]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install trl transformers datasets accelerate
          python -m pip freeze | grep -iE '^(torch|trl|transformers|datasets|accelerate)=='
      - uses: actions/download-artifact@v4
        with:
          name: score-filter-data
          path: data
      - name: Train and evaluate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          python scripts/eval/effect/train_eval.py --data data/${{ matrix.arm }}.jsonl
          --eval data/eval.jsonl --model "$MODEL" --tokenizer "$TOKENIZER" --packing
          --seed ${{ matrix.seed }} --steps "${{ inputs.steps || '400' }}" --gen "${{ inputs.gen || '100' }}"
          --label ${{ matrix.arm }} --out results/${{ matrix.arm }}-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: score-filter-result-${{ matrix.arm }}-${{ matrix.seed }}
          path: results/

  report:
    needs: train
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: score-filter-*
          path: artifacts
      - name: Report
        run: >-
          python scripts/eval/score_filter/report.py --results artifacts
          --stats artifacts/score-filter-data/stats.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: score-filter-summary
          path: artifacts/summary.json
