name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PyPI timeouts made pip backtrack to decade-old numpy / pandas sources that
# no longer build; retry longer and never build those three from source.
env:
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"
  PIP_ONLY_BINARY: "numpy,pandas,pyarrow"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,all]"

      - name: Ruff check
        run: python -m ruff check src tests

      - name: Ruff format
        run: python -m ruff format --check src tests

      - name: Mypy
        run: python -m mypy

      - name: Pytest
        run: python -m pytest

  output-safety:
    name: Output safety (${{ matrix.os }}, Python 3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install file-format test dependencies
        run: python -m pip install -e ".[parquet,xlsx,preset]" pytest
      - name: Inject write and commit failures
        run: >-
          python -m pytest tests/test_atomic_output.py tests/test_output_safety.py
          tests/test_output_integrations.py tests/test_normalize_jsonl.py
          tests/test_tables.py tests/test_same_path.py -q

  distribution:
    name: Build and verify distribution
    needs: [test, output-safety]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build hatchling
      - name: Build sdist and wheel from sdist
        run: python -m build --no-isolation
      - name: Test the installed wheel without the source checkout
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          .wheel-smoke/bin/python -I scripts/verify_wheel.py
          sha256sum dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
