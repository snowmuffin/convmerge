name: Quality

# Runs filter, decontam, and dedupe --near on real rows of every dataset in
# tests/datasets/catalog.json and lists example rows per rule, so rule
# thresholds can be judged against real data. Informational: it fails only
# if the script itself breaks.

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Rows per dataset
        default: "1000"
      only:
        description: Dataset ids to check, space-separated (empty = all)
        default: ""
  pull_request:
    branches: [main]
    paths:
      - src/convmerge/quality.py
      - src/convmerge/decontam.py
      - src/convmerge/normalize/near_dedup.py
      - src/convmerge/_text.py
      - scripts/quality.py
      - .github/workflows/quality.yml

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# PyPI timeouts made pip backtrack to decade-old numpy / pandas sources that
# no longer build; retry longer and never build those three from source.
env:
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"
  PIP_ONLY_BINARY: "numpy,pandas,pyarrow"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[fetch-all,quality]"

      - name: Check catalog datasets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ROWS: ${{ inputs.rows || '1000' }}
          ONLY: ${{ inputs.only }}
        run: |
          # shellcheck disable=SC2086  # ONLY is a space-separated list of ids
          python scripts/quality.py --rows "$ROWS" ${ONLY:+--only $ONLY} \
            --summary "$GITHUB_STEP_SUMMARY" --json quality.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality
          path: quality.json
          if-no-files-found: ignore
