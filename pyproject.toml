[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convmerge"
version = "1.6.4"
description = "Convert Alpaca / ShareGPT datasets to unified messages JSONL for LLM supervised fine-tuning — fetch from HuggingFace or GitHub, normalize, convert, mix, and dedupe in one CLI pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "convmerge contributors" }]
keywords = [
  "llm",
  "sft",
  "fine-tuning",
  "dataset",
  "data-preparation",
  "jsonl",
  "parquet",
  "chat",
  "instruction-tuning",
  "alpaca",
  "sharegpt",
  "huggingface-datasets",
  "messages-format",
  "llm-training",
  "data-pipeline",
  "chat-dataset",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
# YAML manifest fetcher (GitHub raw / Trees API / git clone). Uses stdlib urllib for HTTP.
fetch = ["pyyaml>=6.0"]
# HuggingFace support for fetch (delegates to the ``datasets`` library).
# ``fetch-hf`` and ``fetch-all`` are identical; both names are kept for backward compatibility.
fetch-hf = ["pyyaml>=6.0", "datasets>=2.16"]
fetch-all = ["pyyaml>=6.0", "datasets>=2.16"]
# Parquet streaming input for normalize.
parquet = ["pyarrow>=14"]
# YAML convert presets (convmerge convert --preset, convmerge preset validate).
preset = ["pyyaml>=6.0"]
# Token lengths and chat-template checks (convmerge tokens). No PyTorch needed.
tokens = ["transformers>=4.43", "jinja2>=3.1"]
# Near-duplicate removal (convmerge dedupe --near): MinHash LSH.
quality = ["datasketch>=1.6"]
# Excel workbooks for normalize (.xlsx).
xlsx = ["openpyxl>=3.1"]
# All runtime extras above (PyYAML, HuggingFace ``datasets``, PyArrow, ``transformers``, datasketch, openpyxl).
all = ["pyyaml>=6.0", "datasets>=2.16", "pyarrow>=14", "transformers>=4.43", "jinja2>=3.1", "datasketch>=1.6", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
convmerge = "convmerge.cli:main"

[project.urls]
Homepage = "https://github.com/snowmuffin/convmerge"
Repository = "https://github.com/snowmuffin/convmerge"
Issues = "https://github.com/snowmuffin/convmerge/issues"
Changelog = "https://github.com/snowmuffin/convmerge/blob/main/CHANGELOG.md"
Documentation = "https://github.com/snowmuffin/convmerge#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/convmerge"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
# No python_version: each CI job checks against its own interpreter (3.10 to
# 3.12). Pinning 3.10 made mypy reject the Python 3.12 syntax in stubs that
# newer dependencies install only on newer Pythons (numpy 2.5), failing CI.
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*", "pyarrow", "pyarrow.*", "datasketch", "datasketch.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# convmerge treats tokenizers as Any.
module = ["transformers", "transformers.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
# convmerge's own code must never call its deprecated API.
filterwarnings = ["error::DeprecationWarning:convmerge"]
